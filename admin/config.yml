# Sveltia CMS — the listings admin for nicholsland.
#
# Every tract is one file in data/properties/. Adding a listing creates a file,
# deleting one removes it, and a GitHub Action rebuilds data/properties.json
# (the single array the site actually reads) a few seconds later.
#
# Two fields are deliberately absent from this form: acresLabel and priceLabel.
# They are derived from the acreage and price numbers at build time, so a
# listing can never show "60 acres" next to a label reading "12.9± Acres".
backend:
  name: github
  repo: cohen05heidt/NicholsLandWebsite
  branch: main
  # The authenticator that makes the "Sign in with GitHub" button work. It is
  # a Cloudflare Worker holding the OAuth client secret, because a static site
  # has nowhere to keep one. Deployed from cohen05heidt/sveltia-cms-auth; its
  # settings live in the Cloudflare dashboard, not here. See admin/SETUP.md.
  base_url: https://sveltia-cms-auth.cohen-heidt13.workers.dev
# Photos and PDFs uploaded through the CMS land here. The site is served from
# the root of nicholsland.net, so relative (older listings) and /-prefixed
# (anything uploaded through this screen) paths both resolve.
media_folder: assets/img/properties

public_folder: assets/img/properties

# What happens to a file on its way in. Phone photos run 3-10 MB, and a file
# that size makes the whole save fail ("Failed to fetch"). JPEG, PNG and WebP
# photos are shrunk in the browser to a 2048px WebP before they upload. A
# browser cannot read iPhone HEIC, so those upload as they are and the build
# workflow converts them (tools/convert-heic.py). slugify_filename turns
# "Tillman Creek map.pdf" into "tillman-creek-map.pdf", so no link on the site
# has a space in it.
media_libraries:
  default:
    config:
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2048
          height: 2048
# Saving writes straight to main, which is what makes a listing go live without
# anyone having to approve anything.
publish_mode: simple

collections:

  - name: properties
    label: Properties
    label_singular: Property
    description: >-
      Every tract on the site. Add one and it appears on the home map and the
      properties page within about a minute; delete one and it disappears.
    folder: data/properties
    format: json
    extension: json
    create: true
    delete: true
    slug: '{{title}}'
    summary: '{{title}} — {{city}}, {{county}} · {{acres}} ac'
    sortable_fields: [listed, title, acres, price]
    view_groups:
      - label: Status
        field: status
    # One-click answers to the three questions actually asked of this screen:
    # what's live, what's pending, what has closed. Without these, finding the
    # tract you need to mark Sold means scrolling forty listings.
    view_filters:
      - { label: For sale, field: status, pattern: For Sale }
      - { label: Under contract, field: status, pattern: Under Contract }
      - { label: Sold, field: status, pattern: Sold }
      - { label: On the home page, field: featured, pattern: true }

    fields:

      - name: title
        label: Tract name
        widget: string
        hint: 'How it appears as the headline, e.g. "Jabez Poyner Road Tract".'

      - name: status
        label: Status
        widget: select
        default: For Sale
        options: [For Sale, Under Contract, Sold]
        hint: >-
          Marking a tract Sold is all it takes — it keeps its page and its
          photos, stops showing a price, and drops off the map and the "for
          sale" grid. Nothing else needs doing, and it can be set back.

      - name: featured
        label: Feature on the home page
        widget: boolean
        default: false
        hint: Featured tracts appear in the grid at the top of the home page, newest first. Every featured tract is shown; Sold tracts never are.

      - name: acres
        label: Acreage
        widget: number
        value_type: float
        min: 0
        hint: 'Just the number — the "± Acres" is added automatically.'

      - name: price
        label: Price
        widget: number
        value_type: int
        required: false
        min: 0
        hint: 'Numbers only, no $ or commas. Leave blank to show "Call for Price".'

      - name: city
        label: City / town
        widget: string

      - name: county
        label: County
        widget: string
        hint: 'Include the word County, e.g. "Oglethorpe County".'

      - name: state
        label: State
        widget: string
        default: GA

      - name: types
        label: Land type
        widget: select
        multiple: true
        min: 1
        options: [Timber, Recreational, Homesite, Investment, Management]
        hint: >-
          Pick every type that fits. The first one sets the pin colour on the
          home map. Management is the exception — a tract marked Management
          shows only as a purple pin on the map, with no price, no card in the
          listings and no page of its own.

      - name: listed
        label: Date listed
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        picker_utc: true
        hint: Drives the "Recently Listed" row — newest first.

      - name: lat
        label: Latitude
        widget: number
        value_type: float
        # A wrong number here no longer holds the listing back: the build
        # publishes it without a map pin and flags it on the GitHub Actions run.
        hint: 'Right-click the tract in Google Maps and copy the first number, e.g. 33.9505. Georgia is between 30 and 35.'

      - name: lng
        label: Longitude
        widget: number
        value_type: float
        hint: 'The second number from Google Maps, e.g. -83.0512. It must start with a minus sign — Georgia is between -85.8 and -80.7. A wrong number still publishes the listing, just without a map pin.'

      - name: coordsApprox
        label: Pin is approximate
        widget: boolean
        default: true

      - name: summary
        label: Summary
        widget: text
        hint: One or two sentences. Shown at the top of the listing and in search results.

      - name: bullets
        label: Property overview
        widget: list
        required: false
        # "Point" meant nothing to the person filling this in. "Selling point"
        # is what a land broker would call it out loud, and the hint teaches by
        # example rather than by description — three real lines off a real
        # listing land better than any amount of explaining what a bullet is.
        # The summary puts each line's own text on its collapsed row, so a long
        # list can be read without opening every entry.
        label_singular: Selling point
        summary: '{{fields.point}}'
        field:
          name: point
          label: Selling point
          widget: string
          hint: 'One short line, e.g. "1,200± feet of paved road frontage".'
        hint: >-
          The bullet list a buyer reads under "Property Overview" on the
          listing. Add one line for each thing worth knowing about the tract —
          road frontage, timber, water, power, restrictions, access.


          For example, the three lines on Brewer's Bridge read: "Approximately
          70± acres of 9-year-old planted pines", "1,200± feet of paved road
          frontage on Brewer's Bridge Road", "Approximately 2,800 feet of
          scenic creek frontage".


          Leave it empty and the whole Property Overview section is hidden.

      - name: directions
        label: Directions
        widget: text
        required: false
        hint: Optional. Leave blank and the Directions heading is hidden.

      - name: docs
        label: Maps, plats & documents
        widget: list
        required: false
        label_singular: Document
        summary: '{{fields.label}}'
        fields:
          - { name: label, label: Name, widget: string, hint: 'e.g. Aerial Map, Topo Map, Tract Plat' }
          - { name: url, label: File, widget: file, hint: 'Upload a PDF, or paste a link to one. Keep PDFs under about 8 MB, or the save can fail.' }

      - name: images
        label: Photos
        widget: list
        label_singular: Photo
        # Optional so a tract can go up the day it is listed, before anyone has
        # been out to photograph it. The site shows a "photos coming" tile.
        required: false
        field: { name: image, label: Photo, widget: image }
        hint: 'The first photo is used on cards, the map popup and the listing header. Phone photos, iPhone HEIC included, are resized and converted automatically. Can be left empty until photos are ready.'

      # Exists because the Jeff Davis photographs are AI-enlarged from the only
      # size land.com publishes, and that fact has to survive someone opening
      # the listing and saving it. A field the CMS does not know about is
      # dropped on save, which would have quietly deleted the disclosure.
      # Visible rather than hidden on purpose: the person publishing a listing
      # is exactly the person who should be able to see a note like this.
      - name: photoNote
        label: Note about the photos
        widget: text
        required: false
        hint: >-
          Almost always blank. Fill it in only when the photographs need a
          caveat — enlarged, borrowed, or taken in a different season. Clear it
          when the real photographs go up.

  # The commercial book. Small and slow-moving, which was the original argument
  # for hand-writing these two cards into index.html — until it meant the one
  # part of the site nobody here could change without a developer. Same form,
  # same save, same minute-to-live as a tract.
  - name: commercial
    label: Commercial
    label_singular: Commercial listing
    description: >-
      Buildings and commercial sites for sale or lease. Each one gets a card in
      the Commercial section of the home page and its own listing page, the
      same way a tract does. Marking one Sold or Leased takes it off the site;
      delete it and it is gone entirely. If every listing here is closed or
      deleted, the whole section disappears rather than leaving an empty
      heading.
    folder: data/commercial
    # The two original building photos live in assets/img/, not in the
    # properties folder, so the admin could not find them to show a preview.
    # Pointing this collection at assets/img/ (and storing /-prefixed paths)
    # lets it; new uploads here land alongside them.
    media_folder: /assets/img
    public_folder: /assets/img
    format: json
    extension: json
    create: true
    delete: true
    slug: '{{title}}'
    summary: '{{title}} — {{address}}'
    sortable_fields: [order, title, price, sqft]
    view_filters:
      - { label: For sale, field: status, pattern: For Sale }
      - { label: For lease, field: status, pattern: Lease$ }
      - { label: Under contract, field: status, pattern: Under Contract }
      - { label: Sold or leased, field: status, pattern: '^(Sold|Leased)$' }

    # Laid out in the order a broker reads a commercial listing sheet: what it
    # is and what it costs, how big it is, the building's particulars, where
    # it is, then the words, the photographs and the paperwork. Square footage
    # takes the place acreage has on a tract; the lot size is still here for
    # the sites where the ground matters as much as the building.
    fields:

      - name: title
        label: Headline
        widget: string
        hint: 'What the listing is called, e.g. "Fully Leased Office Building".'

      - name: status
        label: Status
        widget: select
        default: For Sale
        options: [For Sale, For Lease, For Sale/Lease, Under Contract, Sold, Leased]
        hint: >-
          Sold and Leased listings come off the site. Everything else shows on
          the card and the listing page as written.

      - name: placement
        label: Where should this listing show?
        widget: select
        default: both
        options:
          - { label: 'Home page and Properties page', value: both }
          - { label: 'Home page only — under "Commercial assets for sale/lease"', value: home }
          - { label: 'Properties page only — under the land listings', value: properties }
        hint: >-
          The home page shows a short commercial strip and the Properties page
          lists them under the land. Most buildings belong on both; pick one
          when a listing should headline the front page without padding the
          full list, or sit in the full list without taking a front-page slot.

      - name: propertyType
        label: Property type
        widget: select
        multiple: true
        min: 1
        options: [Office, Retail, Medical Office, Restaurant, Industrial, Warehouse, Flex, Mixed Use, Multifamily, Hospitality, Land, Other]
        hint: Pick every type that fits, e.g. Office and Retail for a building with both.

      - name: price
        label: Sale price
        widget: number
        value_type: int
        required: false
        min: 0
        hint: 'Numbers only, no $ or commas. Leave blank for a lease-only listing or to show "Call for Price".'

      - name: leaseRate
        label: Lease rate
        widget: number
        value_type: float
        required: false
        min: 0
        hint: 'Numbers only, e.g. 18.50. Per square foot per year unless you choose "per month" below. Leave blank if it is not for lease.'

      - name: leaseBasis
        label: Lease rate is quoted
        widget: select
        required: false
        default: per SF per year
        options: [per SF per year, per month]

      - name: leaseTerms
        label: Lease type
        widget: select
        required: false
        options: [NNN, Modified Gross, Full Service, Gross]
        hint: 'Shown after the rate, e.g. "$18.50/SF/yr NNN". Leave blank if you would rather not say.'

      - name: sqft
        label: Building size (square feet)
        widget: number
        value_type: int
        required: true
        min: 0
        hint: 'Total building square footage, numbers only, e.g. 1302. The "SF" is added automatically. Enter 0 for a lot with no building.'

      - name: availableSqft
        label: Space available (square feet)
        widget: number
        value_type: int
        required: false
        min: 0
        hint: For lease listings where only part of the building is available. Leave blank if it is the whole building.

      - name: lotAcres
        label: Lot size (acres)
        widget: number
        value_type: float
        required: false
        min: 0
        hint: 'Just the number, e.g. 0.63. The "± Acres" is added automatically.'

      - name: yearBuilt
        label: Year built
        widget: number
        value_type: int
        required: false
        min: 1800
        max: 2100

      - name: zoning
        label: Zoning
        widget: string
        required: false
        hint: 'As the county writes it, e.g. C-G or O-I.'

      - name: parking
        label: Parking
        widget: string
        required: false
        hint: 'e.g. "32 spaces" or "Shared lot, 4.5 per 1,000 SF".'

      - name: occupancy
        label: Occupancy / tenancy
        widget: string
        required: false
        hint: 'e.g. "Vacant", "100% leased", "Long-term credit tenant".'

      - name: suites
        label: Units or suites
        widget: string
        required: false
        hint: 'e.g. "4 suites" or "Single tenant".'

      - name: address
        label: Address
        widget: string
        hint: 'Street, city, state and ZIP — shown under the headline and used for directions.'

      - name: county
        label: County
        widget: string
        required: false
        hint: 'Include the word County, e.g. "Clarke County".'

      - name: lat
        label: Latitude
        widget: number
        value_type: float
        required: false
        hint: 'Optional map pin. Right-click the building in Google Maps and copy the first number, e.g. 33.9519.'

      - name: lng
        label: Longitude
        widget: number
        value_type: float
        required: false
        hint: 'The second number from Google Maps, e.g. -83.3576. Keep the minus sign. Without a pin the page links to the address in Google Maps instead.'

      - name: summary
        label: Summary
        widget: text
        required: false
        hint: One or two sentences. Shown at the top of the listing page.

      - name: highlights
        label: Property highlights
        widget: list
        required: false
        label_singular: Highlight
        summary: '{{fields.point}}'
        field:
          name: point
          label: Highlight
          widget: string
          hint: 'One short line, e.g. "Signalized corner with 24,000 cars a day".'
        hint: >-
          The bullet list under "Property Highlights" on the listing page —
          location, traffic, recent upgrades, tenants, access. Leave it empty
          and the section is hidden.

      - name: images
        label: Photos
        widget: list
        required: false
        label_singular: Photo
        field: { name: image, label: Photo, widget: image }
        hint: >-
          The first photo is the one on the card and at the top of the listing
          page; the rest make up the gallery. Phone photos, iPhone HEIC
          included, are resized and converted automatically.

      - name: alt
        label: Photo description
        widget: string
        required: false
        hint: >-
          Describes the first photo for anyone using a screen reader, and shows
          if the image fails to load. Leave blank and the headline is used.

      - name: docs
        label: Brochures, floor plans & documents
        widget: list
        required: false
        label_singular: Document
        summary: '{{fields.label}}'
        fields:
          - { name: label, label: Name, widget: string, hint: 'e.g. Offering Memorandum, Floor Plan, Site Plan, Survey' }
          - { name: url, label: File, widget: file, hint: 'Upload a PDF, or paste a link to one. Up to about 40 MB.' }

      - name: facts
        label: Other details
        widget: list
        required: false
        # "Label" and "Value" are what a developer calls these two boxes. The
        # person filling them in is typing a heading and the thing underneath
        # it, so that is what they are called now.
        label_singular: Detail
        summary: '{{fields.label}}: {{fields.value}}'
        hint: >-
          Anything the fields above do not cover — ceiling height, loading
          docks, drive-thru, sprinklers, signage, traffic count. Shown in the
          Building Details list on the listing page.
        fields:
          - name: label
            label: Heading
            widget: string
            hint: 'e.g. Ceiling Height, Loading, Signage.'
          - name: value
            label: What it says
            widget: string
            hint: 'e.g. 18 ft clear, 2 dock-high doors, Pylon on Atlanta Hwy.'

      - name: order
        label: Position
        widget: number
        value_type: int
        default: 1
        hint: Lower numbers show first. Ties fall back to alphabetical.
