# Rebuilds data/properties.json and data/commercial.json whenever a listing
# changes.
#
# The CMS at /admin writes one file per tract into data/properties/ and one per
# building into data/commercial/. The site reads a single array for each, so
# something has to join them back up — this does, on every save, about half a
# minute before Pages redeploys.
#
# It only watches the source folders, so the commit it pushes to the two built
# files cannot trigger another run.

name: Build listing data

on:
  push:
    branches: [main]
    paths:
      - 'data/properties/**'
      - 'data/commercial/**'
      - 'assets/img/**'
      - 'tools/build-properties.mjs'
      - 'tools/build-commercial.mjs'
      - 'tools/convert-heic.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-properties
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # iPhone HEIC, TIFF and BMP (which a browser cannot show) and any photo
      # still over 2048px become WebP here, and the listings that name them
      # are repointed, before anything is built. See tools/convert-heic.py.
      - name: Convert photos the site cannot show
        run: |
          if ! ls assets/img assets/img/properties | grep -qiE '[.](heic|heif|tiff?|bmp|jpe?g|jfif|png)$'; then
            echo "No photos to convert."
            exit 0
          fi
          python3 -m pip install --quiet --break-system-packages pillow pillow-heif
          python3 tools/convert-heic.py

      # Both fail loudly on a malformed listing rather than publishing a site
      # with a tract or a building silently missing from it.
      - name: Rebuild data/properties.json
        run: node tools/build-properties.mjs

      - name: Rebuild data/commercial.json
        run: node tools/build-commercial.mjs

      - name: Commit anything the build changed
        run: |
          git add -A data/properties.json data/commercial.json data/properties data/commercial assets/img
          if git diff --cached --quiet; then
            echo "No change to the built listing data."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild listing data from sources"
          # Someone may have saved again while this ran.
          git pull --rebase --quiet origin main
          git push
