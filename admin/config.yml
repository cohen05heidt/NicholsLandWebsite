# Sveltia CMS — the listings admin for nicholsland.
#
# Every tract is one file in data/properties/. Adding a listing creates a file,
# deleting one removes it, and a GitHub Action rebuilds data/properties.json
# (the single array the site actually reads) a few seconds later.
#
# Two fields are deliberately absent from this form: acresLabel and priceLabel.
# They are derived from the acreage and price numbers at build time, so a
# listing can never show "60 acres" next to a label reading "12.9± Acres".
backend:
  name: github
  repo: cohen05heidt/NicholsLandWebsite
  branch: main
  # The authenticator that makes the "Sign in with GitHub" button work. It is
  # a Cloudflare Worker holding the OAuth client secret, because a static site
  # has nowhere to keep one. Deployed from cohen05heidt/sveltia-cms-auth; its
  # settings live in the Cloudflare dashboard, not here. See admin/SETUP.md.
  base_url: https://sveltia-cms-auth.cohen-heidt13.workers.dev
# Photos and PDFs uploaded through the CMS land here. The public path has no
# leading slash on purpose — the site is served from /NicholsLandWebsite/, and
# an absolute path would break every image on it.
media_folder: assets/img/properties

public_folder: assets/img/properties
# Saving writes straight to main, which is what makes a listing go live without
# anyone having to approve anything.
publish_mode: simple

collections:

  - name: properties
    label: Properties
    label_singular: Property
    description: >-
      Every tract on the site. Add one and it appears on the home map and the
      properties page within about a minute; delete one and it disappears.
    folder: data/properties
    format: json
    extension: json
    create: true
    delete: true
    slug: '{{title}}'
    summary: '{{title}} — {{city}}, {{county}} · {{acres}} ac'
    sortable_fields: [listed, title, acres, price]
    view_groups:
      - label: Status
        field: status
    # One-click answers to the three questions actually asked of this screen:
    # what's live, what's pending, what has closed. Without these, finding the
    # tract you need to mark Sold means scrolling forty listings.
    view_filters:
      - { label: For sale, field: status, pattern: For Sale }
      - { label: Under contract, field: status, pattern: Under Contract }
      - { label: Sold, field: status, pattern: Sold }
      - { label: On the home page, field: featured, pattern: true }

    fields:

      - name: title
        label: Tract name
        widget: string
        hint: 'How it appears as the headline, e.g. "Jabez Poyner Road Tract".'

      - name: status
        label: Status
        widget: select
        default: For Sale
        options: [For Sale, Under Contract, Sold]
        hint: >-
          Marking a tract Sold is all it takes — it keeps its page and its
          photos, stops showing a price, and drops off the map and the "for
          sale" grid. Nothing else needs doing, and it can be set back.

      - name: featured
        label: Feature on the home page
        widget: boolean
        default: false
        hint: Featured tracts appear in the carousel at the top of the home page.

      - name: acres
        label: Acreage
        widget: number
        value_type: float
        min: 0
        hint: 'Just the number — the "± Acres" is added automatically.'

      - name: price
        label: Price
        widget: number
        value_type: int
        required: false
        min: 0
        hint: 'Numbers only, no $ or commas. Leave blank to show "Call for Price".'

      - name: city
        label: City / town
        widget: string

      - name: county
        label: County
        widget: string
        hint: 'Include the word County, e.g. "Oglethorpe County".'

      - name: state
        label: State
        widget: string
        default: GA

      - name: types
        label: Land type
        widget: select
        multiple: true
        min: 1
        options: [Timber, Recreational, Homesite, Investment, Management]
        hint: >-
          Pick every type that fits. The first one sets the pin colour on the
          home map. Management is the exception — a tract marked Management
          shows only as a purple pin on the map, with no price, no card in the
          listings and no page of its own.

      - name: listed
        label: Date listed
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        picker_utc: true
        hint: Drives the "Recently Listed" row — newest first.

      - name: lat
        label: Latitude
        widget: number
        value_type: float
        hint: 'Right-click the tract in Google Maps and copy the first number, e.g. 33.9505.'

      - name: lng
        label: Longitude
        widget: number
        value_type: float
        hint: 'The second number from Google Maps, e.g. -83.0512. Keep the minus sign.'

      - name: coordsApprox
        label: Pin is approximate
        widget: boolean
        default: true

      - name: summary
        label: Summary
        widget: text
        hint: One or two sentences. Shown at the top of the listing and in search results.

      - name: bullets
        label: Property overview
        widget: list
        required: false
        # Without label_singular the button reads "Add Property overview",
        # which sounds like it adds a second overview rather than one line to
        # this one. The summary puts each point's own text on its collapsed
        # row, so a ten-point list is readable without opening all ten.
        label_singular: Point
        summary: '{{fields.point}}'
        field: { name: point, label: Point, widget: string }
        hint: >-
          The bulleted list a buyer reads on the listing page — road frontage,
          timber, water, utilities, restrictions. One point per line. Leave it
          empty and the whole Property Overview section is hidden.

      - name: directions
        label: Directions
        widget: text
        required: false
        hint: Optional. Leave blank and the Directions heading is hidden.

      - name: docs
        label: Maps, plats & documents
        widget: list
        required: false
        label_singular: Document
        summary: '{{fields.label}}'
        fields:
          - { name: label, label: Name, widget: string, hint: 'e.g. Aerial Map, Topo Map, Tract Plat' }
          - { name: url, label: File, widget: file, hint: Upload a PDF, or paste a link to one. }

      - name: images
        label: Photos
        widget: list
        label_singular: Photo
        field: { name: image, label: Photo, widget: image }
        hint: The first photo is the one used on cards, the map popup and the listing header.

      # Exists because the Jeff Davis photographs are AI-enlarged from the only
      # size land.com publishes, and that fact has to survive someone opening
      # the listing and saving it. A field the CMS does not know about is
      # dropped on save, which would have quietly deleted the disclosure.
      # Visible rather than hidden on purpose: the person publishing a listing
      # is exactly the person who should be able to see a note like this.
      - name: photoNote
        label: Note about the photos
        widget: text
        required: false
        hint: >-
          Almost always blank. Fill it in only when the photographs need a
          caveat — enlarged, borrowed, or taken in a different season. Clear it
          when the real photographs go up.

  # The commercial book. Small and slow-moving, which was the original argument
  # for hand-writing these two cards into index.html — until it meant the one
  # part of the site nobody here could change without a developer. Same form,
  # same save, same minute-to-live as a tract.
  - name: commercial
    label: Commercial
    label_singular: Commercial listing
    description: >-
      Buildings for sale or lease, shown in the Commercial section of the home
      page. Marking one Sold removes it from the site; delete it and it is gone
      entirely. If every listing here is sold or deleted, the whole section
      disappears rather than leaving an empty heading.
    folder: data/commercial
    format: json
    extension: json
    create: true
    delete: true
    slug: '{{title}}'
    summary: '{{title}} — {{address}}'
    sortable_fields: [order, title, price]
    view_filters:
      - { label: For sale, field: status, pattern: For Sale }
      - { label: For lease, field: status, pattern: For Lease }
      - { label: Sold, field: status, pattern: Sold }

    fields:

      - name: title
        label: Headline
        widget: string
        hint: 'What the card is called, e.g. "Fully Leased Office Building".'

      - name: status
        label: Status
        widget: select
        default: For Sale
        options: [For Sale, For Lease, For Sale/Lease, Under Contract, Sold]
        hint: Sold listings come off the site. Everything else shows on the card as written.

      - name: price
        label: Price
        widget: number
        value_type: int
        required: false
        min: 0
        hint: 'Numbers only, no $ or commas. Leave blank to show "Call for Price".'

      - name: address
        label: Address
        widget: string
        hint: 'Street, city, state and ZIP — shown under the headline.'

      - name: image
        label: Photo
        widget: image
        hint: One photo per listing. Landscape works best.

      - name: alt
        label: Photo description
        widget: string
        required: false
        hint: >-
          Describes the photo for anyone using a screen reader, and shows if the
          image fails to load. Leave blank and the headline is used.

      - name: facts
        label: Details
        widget: list
        required: false
        label_singular: Detail
        summary: '{{fields.label}}: {{fields.value}}'
        hint: >-
          The small print on the card — two fits best. Type / Office, Size /
          1,302 SF, Tenancy / Long-Term Credit Tenant.
        fields:
          - { name: label, label: Label, widget: string }
          - { name: value, label: Value, widget: string }

      - name: order
        label: Position
        widget: number
        value_type: int
        default: 1
        hint: Lower numbers show first. Ties fall back to alphabetical.
